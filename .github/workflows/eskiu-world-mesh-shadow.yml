name: Eskiu world mesh shadow backend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experimental/eskiu/VROEngineWorldMeshEskiu.esk"
      - "experimental/eskiu/VROEngineGeometryEskiu.esk"
      - "tests/eskiu/world_mesh_differential.cpp"
      - "scripts/test-eskiu-world-mesh.sh"
      - "ViroRenderer/extension/VROEngineWorldMeshABI.*"
      - "ViroRenderer/extension/VROEngineGeometryABI.*"
      - ".github/workflows/eskiu-world-mesh.yml"

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ESKIU_VERSION: "0.9.2"
      ESKIU_ARCHIVE_SHA256: "46316ce1553489045aec1cf9fbc432f551cda4850b90d200a7b4c73bc835e8ec"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Eskiu
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/eskiuc.tar.gz"
          prefix="$RUNNER_TEMP/eskiu"
          curl -fsSL "https://github.com/doranteseduardo/eskiu/releases/download/v${ESKIU_VERSION}/eskiuc-linux-x86_64.tar.gz" -o "$archive"
          echo "${ESKIU_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Run differential test
        run: bash scripts/test-eskiu-world-mesh.sh
