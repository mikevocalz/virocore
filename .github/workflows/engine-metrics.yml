name: Engine measurement substrate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ViroRenderer/extension/VROEngineMetrics.*"
      - "tests/extension/engine_metrics_*"
      - "scripts/test-engine-metrics.sh"
      - ".github/workflows/engine-metrics.yml"

permissions:
  contents: read

jobs:
  cxx:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify enabled and disabled metrics modes
        run: bash scripts/test-engine-metrics.sh
