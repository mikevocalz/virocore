name: Eskiu surface media runtime backends

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experimental/eskiu/VROEngineSurfaceEskiu.esk"
      - "experimental/eskiu/VROEngineMediaEskiu.esk"
      - "ViroRenderer/extension/VROEngineSurfaceABI.*"
      - "ViroRenderer/extension/VROEngineSurfaceBackend.*"
      - "ViroRenderer/extension/VROEngineMediaABI.*"
      - "ViroRenderer/extension/VROEngineMediaBackend.*"
      - "ViroRenderer/extension/VROEngineBackendSelector.*"
      - "tests/eskiu/surface_media_runtime_backend_test.cpp"
      - "scripts/test-eskiu-surface-media-runtime.sh"
      - ".github/workflows/eskiu-surface-media-runtime.yml"

permissions:
  contents: read

jobs:
  selector-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ESKIU_VERSION: "0.14.0"
      ESKIU_ARCHIVE_SHA256: "4d6bb09c9995991e32c178fd5d4bcdd85e4652c750ce4f578c386fd5e8f2eb50"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Eskiu
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/eskiuc.tar.gz"
          prefix="$RUNNER_TEMP/eskiu"
          curl -fsSL \
            "https://github.com/eskiu-lang/eskiu/releases/download/v${ESKIU_VERSION}/eskiuc-linux-x86_64.tar.gz" \
            -o "$archive"
          echo "${ESKIU_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Run surface and media runtime conformance
        run: bash scripts/test-eskiu-surface-media-runtime.sh
