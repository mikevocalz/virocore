name: Engine surface ABI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ViroRenderer/extension/VROEngineSurfaceABI.*"
      - "tests/extension/engine_surface_*"
      - "scripts/test-engine-surface.sh"
      - ".github/workflows/engine-surface.yml"

permissions:
  contents: read

jobs:
  c-and-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify surface ABI
        run: bash scripts/test-engine-surface.sh
