name: Engine geometry ABI
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ViroRenderer/extension/VROEngineGeometryABI.*"
      - "tests/extension/engine_geometry_*"
      - "scripts/test-engine-geometry.sh"
      - ".github/workflows/engine-geometry.yml"
permissions:
  contents: read
jobs:
  c-and-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-engine-geometry.sh
