name: XR backend semantic parity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ViroRenderer/extension/VROBackendSemanticContract.h"
      - "tests/xr_backend/specs_semantic_contract_*"
      - "scripts/test-specs-backend-semantics.sh"
      - "docs/SPECS-BACKEND-SEMANTICS.md"
      - ".github/workflows/specs-backend-semantics.yml"
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-specs-backend-semantics.sh
