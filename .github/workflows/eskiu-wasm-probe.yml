name: Eskiu WebAssembly backend probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/eskiu/wasm_target_probe.esk"
      - "scripts/eskiu/probe-wasm-backend.sh"
      - ".github/workflows/eskiu-wasm-probe.yml"
      - "docs/ESKIU-WASM-ENABLEMENT.md"

permissions:
  contents: read

jobs:
  wasm-object:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ESKIU_VERSION: "0.14.0"
      ESKIU_ARCHIVE_SHA256: "4d6bb09c9995991e32c178fd5d4bcdd85e4652c750ce4f578c386fd5e8f2eb50"
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22 wasm-ld
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y lld-22

      - name: Install pinned Eskiu compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/eskiuc-linux-x86_64.tar.gz"
          prefix="$RUNNER_TEMP/eskiu"
          curl -fsSL "https://github.com/eskiu-lang/eskiu/releases/download/v${ESKIU_VERSION}/eskiuc-linux-x86_64.tar.gz" -o "$archive"
          echo "${ESKIU_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Emit and link WASM
        run: bash scripts/eskiu/probe-wasm-backend.sh
