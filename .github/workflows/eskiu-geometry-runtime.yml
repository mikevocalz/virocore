name: Eskiu geometry runtime backend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experimental/eskiu/VROEngineGeometryEskiu.esk"
      - "ViroRenderer/extension/VROEngineGeometryABI.*"
      - "ViroRenderer/extension/VROEngineGeometryBackend.*"
      - "ViroRenderer/extension/VROEngineBackendSelector.*"
      - "tests/eskiu/geometry_runtime_backend_test.cpp"
      - "scripts/test-eskiu-geometry-runtime.sh"
      - ".github/workflows/eskiu-geometry-runtime.yml"
      - "docs/ESKIU-GEOMETRY-RUNTIME.md"

permissions:
  contents: read

jobs:
  selector-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ESKIU_VERSION: "0.14.0"
      ESKIU_ARCHIVE_SHA256: "4d6bb09c9995991e32c178fd5d4bcdd85e4652c750ce4f578c386fd5e8f2eb50"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Eskiu
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/eskiuc.tar.gz"
          prefix="$RUNNER_TEMP/eskiu"
          curl -fsSL \
            "https://github.com/eskiu-lang/eskiu/releases/download/v${ESKIU_VERSION}/eskiuc-linux-x86_64.tar.gz" \
            -o "$archive"
          echo "${ESKIU_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Run selector-backed geometry conformance
        run: bash scripts/test-eskiu-geometry-runtime.sh
