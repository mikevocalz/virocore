name: Build PICO renderer AAR

on:
  push:
    branches: [main, pico-support]
    tags: ['v*-pico*']
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/build-pico-aar.sh'
      - 'scripts/verify-16kb-alignment.py'
      - 'scripts/test_verify_16kb_alignment.py'
      - '.github/workflows/build-pico-aar.yml'
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Resolve and install pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VER="$(sed -nE 's/^[[:space:]]*ndkVersion[[:space:]]*=?[[:space:]]*"([0-9.]+)".*/\1/p' android/viroreact/build.gradle | head -1)"
          test -n "$NDK_VER"
          echo "Installing NDK $NDK_VER"
          sdkmanager "ndk;$NDK_VER"
          test -d "$ANDROID_HOME/ndk/$NDK_VER"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Test alignment verifier
        run: python3 scripts/test_verify_16kb_alignment.py

      - name: Build AAR
        run: ./scripts/build-pico-aar.sh --out "$RUNNER_TEMP/aar"

      - name: Verify 16KB page alignment
        run: python3 scripts/verify-16kb-alignment.py "$RUNNER_TEMP/aar/viro_renderer-release.aar"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: viro_renderer-release-aar
          path: |
            ${{ runner.temp }}/aar/viro_renderer-release.aar
            ${{ runner.temp }}/aar/viro_renderer-release.json
          if-no-files-found: error
