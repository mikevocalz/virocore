name: Eskiu Apple target probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/eskiu/apple_target_probe.esk"
      - "scripts/eskiu/probe-apple-targets.sh"
      - ".github/workflows/eskiu-apple-probe.yml"
      - "docs/ESKIU-APPLE-ENABLEMENT.md"

permissions:
  contents: read

jobs:
  apple-object-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ESKIU_VERSION: "0.14.0"
      ESKIU_ARCHIVE_SHA256: "4d6bb09c9995991e32c178fd5d4bcdd85e4652c750ce4f578c386fd5e8f2eb50"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Eskiu
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/eskiuc-linux-x86_64.tar.gz"
          prefix="$RUNNER_TEMP/eskiu"
          curl -fsSL             "https://github.com/eskiu-lang/eskiu/releases/download/v${ESKIU_VERSION}/eskiuc-linux-x86_64.tar.gz"             -o "$archive"
          echo "${ESKIU_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix"
          echo "ESKIUC=$prefix/bin/eskiuc" >> "$GITHUB_ENV"
      - name: Probe iOS and visionOS object targets
        run: bash scripts/eskiu/probe-apple-targets.sh
