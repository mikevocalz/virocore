name: Eskiu Android target probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install pinned Eskiu v0.14.0
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/eskiu-lang/eskiu/releases/download/v0.14.0/eskiuc-linux-x86_64.tar.gz"
          expected="4d6bb09c9995991e32c178fd5d4bcdd85e4652c750ce4f578c386fd5e8f2eb50"
          curl -fsSL "$url" -o /tmp/eskiuc.tar.gz
          echo "$expected  /tmp/eskiuc.tar.gz" | sha256sum -c -
          mkdir -p /tmp/eskiu
          tar -xzf /tmp/eskiuc.tar.gz -C /tmp/eskiu
          echo "ESKIUC=/tmp/eskiu/bin/eskiuc" >> "$GITHUB_ENV"

      - name: Probe Android target
        run: bash scripts/eskiu/probe-android-target.sh
