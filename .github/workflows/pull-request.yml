name: Renderer

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  androidBuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: 17

      - name: assemble ViroCore
        run: |
          ./gradlew :viroreact:assembleDebug
        working-directory: ./android
      - name: Upload result ViroCore
        uses: actions/upload-artifact@v4.6.0
        with:
          name: viroCore
          path: |
            ./android/virocore/build/outputs/aar/*.aar
            ./android/viroreact/build/outputs/aar/*.aar
            ./android/viroar/build/outputs/aar/*.aar

  AndroidCheck:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: 17
      - name: Code checks
        run: ./gradlew :viroreact:check
      - name: Archive Lint report
        uses: actions/upload-artifact@v4.6.0
        if: ${{ always() }}
        with:
          name: Viro-Lint-report
          path: |
            ./**/build/reports/lint-results.html
            ./**/**/build/reports/lint-results.html

  iosBuild:
    runs-on: ${{ matrix.macOS }}
    strategy:
      fail-fast: false
      matrix:
        xcode: ["16.4"]
        macOS: ["macos-15"]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install gpg
        run: brew install gnupg
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Install pod dependencies
        run: |
          cd ios
          pod install --verbose
        shell: bash
      - name: Build and stage iOS framework
        run: bash scripts/build_ios_framework.sh

      - name: Upload iOS Renderer artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: virokit-iphoneos
          path: ./ios/dist/
          if-no-files-found: error


  wasmBuild:
    name: WebAssembly renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install latest
          /tmp/emsdk/emsdk activate latest

      - name: Build Viro WebAssembly renderer
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/emsdk/emsdk_env.sh
          cd wasm
          ./build_web.sh
          test -s products/build/viro-web.js
          test -s products/build/viro-web.wasm
          test -s products/build/viro-web.data

      - name: Upload WASM renderer
        uses: actions/upload-artifact@v4.6.0
        with:
          name: viro-web-renderer
          path: |
            wasm/products/build/viro-web.js
            wasm/products/build/viro-web.wasm
            wasm/products/build/viro-web.data
