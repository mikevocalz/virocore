name: Eskiu ABI probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ViroRenderer/extension/**"
      - "tests/eskiu/**"
      - "scripts/test-eskiu-abi.sh"
      - ".github/workflows/eskiu-abi.yml"
      - "docs/ESKIU-EXTENSION-ARCHITECTURE.md"
      - "docs/eskiu-migration-manifest.json"

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    env:
      ESKIU_VERSION: "0.9.2"
      ESKIU_ARCHIVE_SHA256: "46316ce1553489045aec1cf9fbc432f551cda4850b90d200a7b4c73bc835e8ec"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Eskiu compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/eskiuc-linux-x86_64.tar.gz"
          prefix="$RUNNER_TEMP/eskiu"
          curl -fL             "https://github.com/doranteseduardo/eskiu/releases/download/v${ESKIU_VERSION}/eskiuc-linux-x86_64.tar.gz"             -o "$archive"
          echo "${ESKIU_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$prefix"
          tar -xzf "$archive" -C "$prefix"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: eskiuc --version

      - name: Run C++ / Eskiu ABI probe
        run: bash scripts/test-eskiu-abi.sh
