name: Eskiu host ABI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/eskiu/**"
      - ".github/workflows/eskiu-host-abi.yml"

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Eskiu v0.9.2
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/doranteseduardo/eskiu/releases/download/v0.9.2/eskiuc-linux-x86_64.tar.gz"
          expected="46316ce1553489045aec1cf9fbc432f551cda4850b90d200a7b4c73bc835e8ec"
          curl -fsSL "$url" -o /tmp/eskiuc.tar.gz
          echo "$expected  /tmp/eskiuc.tar.gz" | sha256sum -c -
          mkdir -p /tmp/eskiu
          tar -xzf /tmp/eskiuc.tar.gz -C /tmp/eskiu
          /tmp/eskiu/bin/eskiuc --version

      - name: Run C++ <-> Eskiu ABI proof
        env:
          ESKIUC: /tmp/eskiu/bin/eskiuc
        run: bash tests/eskiu/run_host_abi_smoke.sh
