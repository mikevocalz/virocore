plugins {
    id "com.android.library"
}

def eskiucPath = System.getenv("ESKIUC")
if (eskiucPath == null || eskiucPath.isEmpty()) {
    throw new GradleException("ESKIUC must point to the pinned Eskiu compiler")
}

android {
    namespace "com.reactvision.eskiuprobe"
    compileSdk 33
    ndkVersion "27.2.12479018"

    defaultConfig {
        minSdk 24
        targetSdk 33

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DVIRO_ESKIU_COMPILER=${eskiucPath}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}
